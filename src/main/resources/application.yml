spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tiny_light?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${MYSQL_PASSWORD:CHANGE_ME}  # 占位：真实密码写在 application-local.yml 里（不进 git）
  sql:
    init:
      mode: always  # 启动时自动执行 schema.sql 建表
  config:
    import: "optional:classpath:application-local.yml"  # 自动加载本地配置（如果存在）

mybatis:
  configuration:
    map-underscore-to-camel-case: true  # user_id -> userId 自动映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印 SQL

server:
  port: 8080
